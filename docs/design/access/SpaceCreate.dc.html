<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New space dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.bar{height:12px;border-radius:4px;background:#E3E1DC}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.box{width:18px;height:18px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width:1120px;height:720px;position:relative;font-family:'IBM Plex Sans',sans-serif;color:#2B2A27;overflow:hidden;border-radius:10px;border:1px solid #DAD8D2;box-sizing:border-box;background:#fff">
  <div style="position:absolute;inset:0;display:flex">
    <div style="width:268px;background:#F7F6F3;padding:60px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
      <div class="bar" style="width:60%"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:50%"></div><div class="bar" style="width:75%"></div>
    </div>
    <div style="flex:1;padding:80px;display:flex;flex-direction:column;gap:18px"><div class="bar" style="width:40%;height:28px"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:60%"></div></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(20,20,19,0.38)"></div>
  <div role="dialog" aria-label="New space" style="position:absolute;left:300px;top:60px;width:520px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,0.25);padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">
    <h2 style="margin:0;font-size:20px;font-weight:600">New space</h2>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="sname" style="font-size:13px;font-weight:500;color:#3F3D39">Name</label>
      <input id="sname" value="Party for Sam" style="height:38px;border:1px solid #2563EB;border-radius:6px;padding:0 12px;font:inherit;font-size:15px;outline:2px solid #BFD3FB">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:13px;font-weight:500;color:#3F3D39;margin-bottom:4px">Who's in it?</div>
      <div class="row" style="background:#F7F6F3"><span class="av" style="background:#1D4ED8">C</span><span style="flex:1">Chris <span style="color:#5F5D58">(you)</span></span><span style="font-size:13px;color:#5F5D58">Creator</span></div>
      <div class="row"><span class="av" style="background:#6D28D9">A</span><span style="flex:1">Alex</span><span class="box" style="background:#2563EB"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg></span></div>
      <div class="row"><span class="av" style="background:#0F766E">J</span><span style="flex:1">Jo</span><span class="box" style="background:#2563EB"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg></span></div>
      <div class="row"><span class="av" style="background:#B45309">S</span><span style="flex:1">Sam</span><span class="box" style="border:1.5px solid #A8A59E"></span></div>
      <div class="row"><span class="av" style="background:#9A3412">D</span><span style="flex:1">Dana <span style="font-size:12px;padding:2px 6px;border-radius:4px;background:#F3EEE6;color:#6B4E16">Guest</span></span><span class="box" style="border:1.5px solid #A8A59E"></span></div>
    </div>
    <div style="font-size:13px;line-height:1.5;color:#4B4945;background:#F7F6F3;border-radius:8px;padding:12px 14px">Members see and edit everything in this space. Anyone left out won't see its name, its pages, or anything from it in search.</div>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button type="button" style="height:38px;padding:0 16px;border-radius:6px;border:1px solid #D6D3CC;background:#fff;font:inherit;font-size:14px;color:#2B2A27">Cancel</button>
      <button type="button" style="height:38px;padding:0 16px;border-radius:6px;border:none;background:#1D4ED8;font:inherit;font-size:14px;font-weight:500;color:#fff">Create space</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
