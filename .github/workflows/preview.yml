# A preview named after its branch (ADR-PLAT-008): each push to a pull request from this repo tests
# the preview image, then deploys it and keeps one comment on the pull request up to date with its
# links. Closing or merging the pull request, or deleting the branch, removes the preview. Pull
# requests from forks get no secrets, so they get no preview, and neither do pull requests that only
# change docs. Until tools/preview/setup.sh has set the repository's settings, only the image test runs.
#
# Run by hand, it deploys the branch chosen under "Use workflow from", with or without a pull request,
# and the run's summary lists the links. GitHub reads this file from the chosen branch, so a branch
# must include it.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only changes that reach the preview image, so a docs-only pull request gets no preview.
    paths:
      - apps/**
      - packages/**
      - platform/**
      - tools/preview/**
      - tools/package.json
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/preview.yml
      - "!**/*.md"
      - "!**/docs/**"
  workflow_dispatch:
  delete:

permissions:
  contents: read
  pull-requests: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_ORG: ${{ vars.FLY_ORG }}
  FLY_REGION: ${{ vars.FLY_REGION }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
  DNSIMPLE_TOKEN: ${{ secrets.DNSIMPLE_TOKEN }}
  DNSIMPLE_ACCOUNT_ID: ${{ secrets.DNSIMPLE_ACCOUNT_ID }}
  # The image is built once, then tested and deployed as is.
  PREVIEW_IMAGE: homelab-preview:ci

jobs:
  # Its own job because only a job's concurrency group can use what an earlier job found.
  identify:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.name.outputs.name }}
      number: ${{ steps.pull-request.outputs.number }}
      sha: ${{ steps.pull-request.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - id: name
        env:
          # A delete event's github.ref is the default branch, so the deleted one is only in its payload.
          BRANCH: ${{ github.head_ref || (github.event_name == 'delete' && github.event.ref) || github.ref_name }}
        run: echo "name=$(node tools/preview/name.ts "$BRANCH")" >> "$GITHUB_OUTPUT"
      - id: pull-request
        uses: actions/github-script@v8
        with:
          script: |
            const { pull_request } = context.payload;
            if (pull_request) {
              core.setOutput("number", pull_request.number);
              core.setOutput("sha", pull_request.head.sha);
              return;
            }
            core.setOutput("sha", context.sha);
            if (context.eventName !== "workflow_dispatch") return;
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const { data: [open] } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: "open" });
            if (open) core.setOutput("number", open.number);

  deploy:
    needs: identify
    if: github.event.action != 'closed' && github.event_name != 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push, or closing the pull request, cancels a deploy still running for an older commit.
    concurrency:
      group: preview-${{ needs.identify.outputs.name }}
      cancel-in-progress: true
    env:
      NAME: ${{ needs.identify.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: vars.PREVIEW_DOMAIN != ''
      # First, so the certificate issues while the image builds and is tested.
      - name: Prepare the preview
        if: vars.PREVIEW_DOMAIN != ''
        run: tools/preview/preview.sh prepare "$NAME"
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@v3
      # Built here with its layers cached in GitHub's cache, so most pushes reinstall nothing.
      - name: Build the preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/preview/Dockerfile
          tags: ${{ env.PREVIEW_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the preview image
        timeout-minutes: 10
        run: npm run e2e -w @homelab/tools
      - name: Deploy the preview
        if: vars.PREVIEW_DOMAIN != ''
        run: tools/preview/preview.sh deploy "$NAME"
      - name: Write the comment
        if: vars.PREVIEW_DOMAIN != ''
        run: |
          node tools/preview/comment.ts "$NAME" "$PREVIEW_DOMAIN" "${{ needs.identify.outputs.sha }}" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the comment
        if: vars.PREVIEW_DOMAIN != '' && needs.identify.outputs.number != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/comment.md`, "utf8");
            const marker = body.split("\n")[0];
            const { owner, repo } = context.repo;
            const issue_number = ${{ needs.identify.outputs.number }};
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  remove:
    needs: identify
    if: (github.event.action == 'closed' || github.event_name == 'delete') && vars.PREVIEW_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Merging closes the pull request and deletes the branch at once. The close's run must not be
    # stopped, since only it can update the comment, so the delete's run waits its turn.
    concurrency:
      group: preview-${{ needs.identify.outputs.name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      NAME: ${{ needs.identify.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Remove the preview
        run: tools/preview/preview.sh remove "$NAME"
      - name: Say so on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const body = execFileSync("node", ["tools/preview/comment.ts", process.env.NAME, process.env.PREVIEW_DOMAIN, "--removed"], { encoding: "utf8" });
            const marker = body.split("\n")[0];
            const { owner, repo } = context.repo;
            const issue_number = ${{ needs.identify.outputs.number }};
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
