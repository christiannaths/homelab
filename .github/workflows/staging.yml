# Deploys staging (ADR-PLAT-008): main on every push, so staging always shows what has merged, or
# another branch when run by hand. Its accounts and data are kept until the Reset preview workflow
# wipes them. The run's summary lists the links.
name: Deploy to staging

on:
  push:
    branches: [main]
    # Only changes that reach the preview image, so merging docs alone leaves staging as it is.
    paths:
      - apps/**
      - packages/**
      - platform/**
      - tools/preview/**
      - tools/package.json
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/staging.yml
      - "!**/*.md"
      - "!**/docs/**"
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to deploy (the next push to main replaces it)
        required: true
        default: main

concurrency:
  group: preview-staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG }}
      FLY_REGION: ${{ vars.FLY_REGION }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      DNSIMPLE_TOKEN: ${{ secrets.DNSIMPLE_TOKEN }}
      DNSIMPLE_ACCOUNT_ID: ${{ secrets.DNSIMPLE_ACCOUNT_ID }}
      PREVIEW_IMAGE: homelab-preview:ci
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # First, so a new certificate issues while the image builds.
      - name: Prepare staging
        run: tools/preview/preview.sh prepare staging
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: docker/setup-buildx-action@v3
      # Built here with its layers cached in GitHub's cache, so most pushes reinstall nothing, and
      # pull requests start from main's layers.
      - name: Build the preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/preview/Dockerfile
          tags: ${{ env.PREVIEW_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy staging
        run: tools/preview/preview.sh deploy staging
      - name: List the links
        run: node tools/preview/comment.ts staging "$PREVIEW_DOMAIN" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
