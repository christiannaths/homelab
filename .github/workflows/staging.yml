# Deploys staging (ADR-PLAT-008): main on every push, so staging always shows what has merged, or
# another branch when run by hand. Its accounts and data are kept until the Reset preview workflow
# wipes them. The run's summary lists the links.
name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to deploy (the next push to main replaces it)
        required: true
        default: main

concurrency:
  group: preview-staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG }}
      FLY_REGION: ${{ vars.FLY_REGION }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      DNSIMPLE_TOKEN: ${{ secrets.DNSIMPLE_TOKEN }}
      DNSIMPLE_ACCOUNT_ID: ${{ secrets.DNSIMPLE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy staging
        run: tools/preview/preview.sh deploy staging
      - name: List the links
        run: node tools/preview/comment.ts staging "$PREVIEW_DOMAIN" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
