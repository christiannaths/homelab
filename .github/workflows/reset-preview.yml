# Wipes one preview's accounts and data and starts it with fresh test accounts (ADR-PLAT-008).
name: Reset preview

on:
  workflow_dispatch:
    inputs:
      name:
        description: The preview to reset, such as staging or pr-81
        required: true
        default: staging

# Waits for a deploy of the same preview to finish first.
concurrency:
  group: preview-${{ inputs.name }}

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG }}
      FLY_REGION: ${{ vars.FLY_REGION }}
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      DNSIMPLE_TOKEN: ${{ secrets.DNSIMPLE_TOKEN }}
      DNSIMPLE_ACCOUNT_ID: ${{ secrets.DNSIMPLE_ACCOUNT_ID }}
      PREVIEW: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Reset the preview
        run: tools/preview/preview.sh reset "$PREVIEW"
