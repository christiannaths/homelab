# VoidAuth for the spike: the official image, unmodified, pinned to v1.16.0 by digest.
# SQLite, so it is one container. Everything VoidAuth writes lives in $VOIDAUTH_DATA.
name: ${COMPOSE_PROJECT_NAME:-voidauth-sso-poc}
services:
  voidauth:
    image: voidauth/voidauth:1.16.0@sha256:189ef16fe81f9de0753d1da610813465b2b09412506c2e96f1e0384ee2ca4a97
    ports:
      - "${VOIDAUTH_PORT:-3000}:3000"
    volumes:
      - ${VOIDAUTH_DATA:-./data}/config:/app/config
      - ${VOIDAUTH_DATA:-./data}/db:/app/db
    environment:
      # Plain http on localhost for the spike; in the homelab this is the https URL behind the reverse proxy.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Encrypts secrets at rest. At least 32 characters: `openssl rand -hex 24`.
      STORAGE_KEY: ${STORAGE_KEY:?set STORAGE_KEY to at least 32 random characters}
      DB_ADAPTER: sqlite
      # Where people land after accepting an invite or signing out.
      DEFAULT_REDIRECT: ${DEFAULT_REDIRECT:-http://localhost:4100/}
      # Open self-registration: a VoidAuth account grants nothing by itself, each app keeps its own list.
      SIGNUP: ${SIGNUP:-true}
      SIGNUP_REQUIRES_APPROVAL: ${SIGNUP_REQUIRES_APPROVAL:-false}
      PASSWORD_STRENGTH: ${PASSWORD_STRENGTH:-3}
      # Mutating requests per minute per IP address. The tests come from one address.
      API_RATELIMIT: ${API_RATELIMIT:-60}
      # Who may set X-Forwarded-For. The default trusts every private address, so any device on the
      # home network could forge its address; in the homelab set this to the reverse proxy's address
      # and don't publish the port (see FINDINGS.md, question 8).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Notes, declared as an OIDC app here instead of through the admin screens.
      OIDC_notes_CLIENT_DISPLAY_NAME: Notes
      OIDC_notes_CLIENT_SECRET: ${NOTES_CLIENT_SECRET:-notes-spike-secret}
      OIDC_notes_CLIENT_REDIRECT_URLS: ${NOTES_REDIRECT_URL:-http://localhost:4100/callback}
      OIDC_notes_CLIENT_SKIP_CONSENT: "true"
