# A second VoidAuth for the rate-limit tests only. Host networking, so VoidAuth sees each
# client's real address (127.0.0.x) instead of Docker's gateway. Same pinned image.
name: voidauth-sso-poc-ratelimit
services:
  voidauth:
    image: voidauth/voidauth:1.16.0@sha256:189ef16fe81f9de0753d1da610813465b2b09412506c2e96f1e0384ee2ca4a97
    network_mode: host
    volumes:
      - ${VOIDAUTH_DATA:?}/config:/app/config
      - ${VOIDAUTH_DATA:?}/db:/app/db
    environment:
      APP_URL: http://localhost:3320
      APP_PORT: "3320"
      STORAGE_KEY: ${STORAGE_KEY:?}
      DB_ADAPTER: sqlite
      API_RATELIMIT: "5"
      # Unset means VoidAuth's default: loopback, linklocal, uniquelocal.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
