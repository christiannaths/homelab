# The whole homelab on one machine, for trying it by hand: the gateway (Caddy), the accounts service,
# Home, Notes and the Encyclopedia, each on its own hostname under HOMELAB_DOMAIN. Start it with
# `npm run dev` from the repository root, which also builds the apps and loads the test people
# (see README.md). Only the gateway publishes a port: the apps trust the Remote-* headers the
# gateway sets.
name: homelab-dev
services:
  gateway:
    # Built from packages/gateway by whatever starts this stack.
    image: homelab-gateway
    command: caddy run --config /etc/caddy/gateway.caddyfile --adapter caddyfile
    ports:
      - "${GATEWAY_PORT:-8443}:443"
    volumes:
      - ./gateway.caddyfile:/etc/caddy/gateway.caddyfile:ro
      - caddy:/data
      # The Encyclopedia's static build, served by the gateway.
      - ../../apps/encyclopedia/web/dist:/srv/encyclopedia:ro
    environment:
      HOMELAB_DOMAIN: ${HOMELAB_DOMAIN:-homelab.localhost}
    depends_on: [accounts, home, notes]

  # The accounts service (apps/accounts/server), run from this checkout.
  accounts:
    image: node:26-alpine@sha256:6f08a523443ddedf52941874c203475b0ad503e859ad70cb26ab8be9a517dbd5
    working_dir: /repo
    command: node --no-experimental-webstorage apps/accounts/server/src/index.ts
    volumes:
      - ../..:/repo:ro
      - accounts:/data
    environment:
      HOMELAB_DOMAIN: ${HOMELAB_DOMAIN:-homelab.localhost}
      ACCOUNTS_URL: https://accounts.${HOMELAB_DOMAIN:-homelab.localhost}:${GATEWAY_PORT:-8443}
      ACCOUNTS_SECRET: ${ACCOUNTS_SECRET:?set ACCOUNTS_SECRET to at least 32 random characters}
      HOMELAB_APPS: notes,encyclopedia
      DATA_DIR: /data
      PORT: "3000"
      # The one-click sign-in links start.ts prints. Only dev turns them on.
      TEST_SIGN_IN_LINKS: "on"

  # The real Home server, run from this checkout. It serves apps/home/web/dist. It reads each app's
  # manifest through the gateway, since *.homelab.localhost is this container itself, trusting the
  # CA the gateway keeps in its volume.
  home:
    image: node:26-alpine@sha256:6f08a523443ddedf52941874c203475b0ad503e859ad70cb26ab8be9a517dbd5
    working_dir: /repo
    command: node apps/home/server/src/index.ts
    volumes:
      - ../..:/repo:ro
      - caddy:/caddy:ro
    environment:
      HOMELAB_URL: https://${HOMELAB_DOMAIN:-homelab.localhost}:${GATEWAY_PORT:-8443}
      GATEWAY_URL: https://gateway:443
      GATEWAY_CA: /caddy/caddy/pki/authorities/local/root.crt
      PORT: "3000"

  # The real Notes server, run from this checkout. It serves apps/notes/web/dist.
  notes:
    image: node:26-alpine@sha256:6f08a523443ddedf52941874c203475b0ad503e859ad70cb26ab8be9a517dbd5
    working_dir: /repo
    command: node --no-experimental-webstorage apps/notes/server/src/index.ts
    volumes:
      - ../..:/repo:ro
      - notes:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data

volumes:
  caddy:
  accounts:
  notes:
